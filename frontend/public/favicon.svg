<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container background with subtle rounded border -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Book outer frame / pages -->
  <g filter="url(#neonGlow)">
    <!-- Book Base spine curves -->
    <path d="M 64 96 Q 44 91 24 97 L 24 40 Q 44 34 64 42 Q 84 34 104 40 L 104 97 Q 84 91 64 96 Z"
          fill="none" stroke="url(#cyanBlueGrad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Central N Circuit Pattern -->
    <!-- Left vertical bar of N + circuit trace -->
    <path d="M 38 88 L 38 48 L 48 48 L 48 78" 
          fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Diagonal of N and circuit bus -->
    <path d="M 48 48 L 80 88 L 80 56" 
          fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right bar of N and connection -->
    <path d="M 80 88 L 90 88 L 90 48" 
          fill="none" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center spine divider -->
    <line x1="64" y1="42" x2="64" y2="96" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Tech Circuit Nodes / Dots -->
    <circle cx="38" cy="88" r="3.5" fill="#38bdf8"/>
    <circle cx="48" cy="78" r="3" fill="#67e8f9"/>
    <circle cx="90" cy="48" r="3.5" fill="#38bdf8"/>
    <circle cx="80" cy="56" r="3" fill="#67e8f9"/>

    <!-- Glowing central pulse node -->
    <circle cx="64" cy="68" r="4" fill="#ffffff"/>
    <circle cx="64" cy="68" r="6" fill="#38bdf8" fill-opacity="0.6"/>
  </g>
</svg>